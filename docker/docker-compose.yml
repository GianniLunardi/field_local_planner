x-field-local-planner-environment: &field-local-planner-environment
  ROS_DISTRO: ${ROS_DISTRO:-noetic}
  PLANNER_WS: ${PLANNER_WS:-/home/gianni/planner_ws}
  PLANNER_LAUNCH_FILE: ${PLANNER_LAUNCH_FILE:-rmp.launch}

x-field-local-planner-base: &field-local-planner-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BASE_IMAGE: ${PLANNER_BASE_IMAGE:-anymal-dev:release-25.09}
      ROS_DISTRO: ${ROS_DISTRO:-noetic}
      USERNAME: ${PLANNER_USER:-gianni}
  image: ${PLANNER_IMAGE:-field-local-planner:anymal-dev-release-25.09}
  entrypoint:
    - /bin/bash
    - ${PLANNER_WS:-/home/gianni/planner_ws}/src/field_local_planner/docker/entrypoint.sh
  working_dir: ${PLANNER_WS:-/home/gianni/planner_ws}
  network_mode: host
  ipc: host
  stop_signal: SIGINT
  stop_grace_period: 1m
  environment:
    <<: *field-local-planner-environment
  volumes:
    - ../../..:${PLANNER_WS:-/home/gianni/planner_ws}:rw

services:
  build:
    <<: *field-local-planner-base
    command: build

  sim:
    <<: *field-local-planner-base
    devices:
      - /dev/input/js0:/dev/input/js0
    environment:
      <<: *field-local-planner-environment
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - ../../..:${PLANNER_WS:-/home/gianni/planner_ws}:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: 
       - run
       - use_sim_time:=true
       - launch_planner:=true
       - launch_filters:=true
       - launch_turtle:=false
       - launch_rviz:=true
       - launch_joy:=true
       - launch_teleop:=true
       - launch_twist_mux:=true
       - launch_twist_converter:=true
       - save_data:=true
       - rosbag_folder:=${PLANNER_WS:-/home/gianni/planner_ws}/bags
       - rosbag_prefix:=field_local_planner
       - >-
         rosbag_topics:=/tf
         /tf_static
         /legged_odometry/pose_in_odom
         /legged_odometry/twist
         /near_field_mapping/elevation_map
         /elevation_mapping/elevation_map_filtered
         /initialpose
         /field_local_planner/twist
         /cmd_vel
         /twist_mux/cmd_vel
         /motion_reference/command_twist
         /survey_waypoints
         /survey_waypoint_markers
         /lidar/point_cloud
         /slam/global_map

  viz:
    <<: *field-local-planner-base
    environment:
      <<: *field-local-planner-environment
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - ../../..:${PLANNER_WS:-/home/gianni/planner_ws}:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      - viz
      - rosbag_name:=${ROSBAG_NAME:-${PLANNER_WS:-/home/gianni/planner_ws}/bags/field_local_planner.bag}

  turtle:
    <<: *field-local-planner-base
    # devices:
      # - /dev/input/js0:/dev/input/js0
    environment:
      <<: *field-local-planner-environment
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      PLANNER_LAUNCH_FILE: ${PLANNER_LAUNCH_FILE:-rmp_turtle.launch}
    volumes:
      - ../../..:${PLANNER_WS:-/home/gianni/planner_ws}:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: 
       - run
       - use_sim_time:=true
       - launch_planner:=true
       - launch_filters:=false
       - launch_turtle:=true
       - launch_rviz:=true
       - launch_joy:=false
       - launch_teleop:=false
       - launch_twist_mux:=false
       - launch_twist_converter:=false

  experiment-host:
    <<: *field-local-planner-base
    # profiles: ["experiment-host"]
    devices:
      - /dev/input/js0:/dev/input/js0
    environment:
      <<: *field-local-planner-environment
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
      ROS_MASTER_URI: http://anymal-d148-lpc:11311
      ROS_IP: 192.168.123.138
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - ../../..:${PLANNER_WS:-/home/gianni/planner_ws}:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      - run
      - launch_planner:=false
      - launch_filters:=false
      - launch_rviz:=true
      - launch_joy:=true
      - launch_teleop:=true
      - launch_twist_mux:=true
      - launch_twist_converter:=true

  experiment-robot:
    <<: *field-local-planner-base
    # profiles: ["experiment-robot"]
    environment:
      <<: *field-local-planner-environment
      PLANNER_WS: ${PLANNER_WS:-/home/integration/planner_ws}
      ROS_MASTER_URI: http://anymal-d148-lpc:11311
    command:
      - run
      - launch_planner:=true
      - launch_filters:=true
      - launch_rviz:=false
      - launch_joy:=false
      - launch_teleop:=false
      - launch_twist_mux:=false
      - launch_twist_converter:=false
      - save_data:=true
      - rosbag_folder:=${PLANNER_WS:-/home/integration/planner_ws}/bags
      - rosbag_prefix:=field_local_planner
      - >-
        rosbag_topics:=/tf
        /tf_static
        /legged_odometry/pose_in_odom
        /legged_odometry/twist
        /near_field_mapping/elevation_map
        /elevation_mapping/elevation_map_filtered
        /initialpose
        /field_local_planner/twist
        /cmd_vel
        /twist_mux/cmd_vel
        /motion_reference/command_twist
        /survey_waypoints
        /survey_waypoint_markers
        /lidar/point_cloud
        /slam/global_map
  
